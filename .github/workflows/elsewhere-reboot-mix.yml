name: Elsewhere Reboot Episode Audio Assembly
on:
  push:
    branches: [elsewhere-reboot-2026]
    paths:
      - 'stories/series/elsewhere/reboot-2026/episodes/episode-001/mix-master.py'
      - '.github/workflows/elsewhere-reboot-mix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Assemble
        run: python stories/series/elsewhere/reboot-2026/episodes/episode-001/mix-master.py
      - uses: actions/upload-artifact@v4
        with:
          name: elsewhere-episode-001-mix-preview
          path: stories/series/elsewhere/reboot-2026/episodes/episode-001/output/*
