name: Audiobook production acceptance
on:
  pull_request:
    paths:
      - 'tools/audiobook/**'
      - '.github/workflows/audiobook-production-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/audiobook
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install 'numpy==2.3.5'
      - name: Run acceptance tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tools/audiobook -v
