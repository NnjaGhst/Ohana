name: Elsewhere Ep1 - remove verified extra word V6
on:
  push:
    branches: [elsewhere-reboot-2026]
    paths:
      - '.github/workflows/elsewhere-clean-v6.yml'
      - 'stories/series/elsewhere/reboot-2026/episodes/episode-001/clean_glitch_v6.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            stories/series/elsewhere/reboot-2026/episodes/episode-001/audio
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean_glitch_v6.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and pydub
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pydub
      - name: Remove duplicate spoken syllable and create QA snippets
        env:
          OUTPUT_DIR: ${{ runner.temp }}/elsewhere-v6
        run: python stories/series/elsewhere/reboot-2026/episodes/episode-001/clean_glitch_v6.py
      - name: Save new preview on reboot branch, not public catalog
        if: success()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/elsewhere-v6
        run: |
          set -e
          target=stories/series/elsewhere/reboot-2026/episodes/episode-001/audio
          mkdir -p "$target"
          cp "$OUTPUT_DIR/Elsewhere_Episode_01_Cassian_Clean_V6.mp3" "$target/episode-001-v6-unreviewed.mp3"
          cp "$OUTPUT_DIR/around-3m18s-v6.mp3" "$target/around-3m18s-v6.mp3"
          cp "$OUTPUT_DIR/around-5m00s-v6.mp3" "$target/around-5m00s-v6.mp3"
          cp "$OUTPUT_DIR/edit-report-v6.json" "$target/edit-report-v6.json"
          git config user.name "Elsewhere Audio Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$target"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save V6 audition after removing verified duplicate word"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin elsewhere-reboot-2026
            git rebase origin/elsewhere-reboot-2026
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elsewhere-ep1-v6-audio-preview
          path: |
            ${{ runner.temp }}/elsewhere-v6/Elsewhere_Episode_01_Cassian_Clean_V6.mp3
            ${{ runner.temp }}/elsewhere-v6/around-3m18s-v6.mp3
            ${{ runner.temp }}/elsewhere-v6/around-5m00s-v6.mp3
          if-no-files-found: warn
          retention-days: 7
