name: Elsewhere Reboot Episode 1 - Audio Assembly
on:
  push:
    branches: [elsewhere-reboot-2026]
    paths:
      - .github/workflows/elsewhere-audio.yml
      - stories/series/elsewhere/reboot-2026/episodes/episode-001/*.json
      - stories/series/elsewhere/reboot-2026/episodes/episode-001/assemble_reboot.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            stories/series/elsewhere/reboot-2026/episodes/episode-001
          sparse-checkout-cone-mode: false
      - name: Install speech alignment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydub stable-ts
      - name: Mix Wade narration with Hallie dialogue and inner thoughts
        env:
          OUTPUT_DIR: ${{ runner.temp }}/elsewhere-audio
        run: |
          python stories/series/elsewhere/reboot-2026/episodes/episode-001/assemble_reboot.py
      - name: Publish private-to-branch preview files
        if: success()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/elsewhere-audio
        run: |
          set -e
          target=stories/series/elsewhere/reboot-2026/episodes/episode-001/audio
          mkdir -p "$target"
          cp "$OUTPUT_DIR"/Elsewhere_Episode_01_A_Place_That_Doesnt_Remember.mp3 "$target/episode-001-preview.mp3"
          cp "$OUTPUT_DIR"/edit-report.json "$target/edit-report.json"
          git config user.name "Elsewhere Audio Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then echo "No preview changes"; else git commit -m "Add Elsewhere reboot episode 1 audio preview"; git push; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: elsewhere-reboot-ep1-audio-preview
          path: |
            ${{ runner.temp }}/elsewhere-audio/Elsewhere_Episode_01_A_Place_That_Doesnt_Remember.mp3
            ${{ runner.temp }}/elsewhere-audio/edit-report.json
          retention-days: 7
