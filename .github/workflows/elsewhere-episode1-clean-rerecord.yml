name: Elsewhere Episode 1 - Whole Phrase Full Rerecording
on:
  push:
    branches: [elsewhere-reboot-2026]
    paths:
      - '.github/workflows/elsewhere-episode1-clean-rerecord.yml'
      - 'stories/series/elsewhere/reboot-2026/episodes/episode-001/assemble_clean_phrase_rebuild_v2.py'
  workflow_dispatch:
concurrency:
  group: elsewhere-episode1-clean-phrase-master
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            stories/series/elsewhere/reboot-2026/episodes/episode-001/assemble_clean_phrase_rebuild_v2.py
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-cue-sheet.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-001-016.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-017-032.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-033-048.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-049-064.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-065-080.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-081-096.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-097-112.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-113-128.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-129-144.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-145-160.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-161-176.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-177-192.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-193-208.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-209-224.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-recordings-225-230.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-pickup-046.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/clean-rebuild-v2-pickups-split-lines-054-130.json
            stories/series/elsewhere/reboot-2026/episodes/episode-001/audio/club-repaired-preview/crooked-lantern-clean-voices.mp3
            stories/series/elsewhere/reboot-2026/episodes/episode-001/audio/club-repaired-preview/club-clean-rebuild-report.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and audio package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pydub
      - name: Download independent complete takes and build clean audiobook
        env:
          OUTPUT_DIR: ${{ runner.temp }}/elsewhere-clean-phrases-v2
        run: python stories/series/elsewhere/reboot-2026/episodes/episode-001/assemble_clean_phrase_rebuild_v2.py
      - name: Store clean master and QA previews, development branch only
        env:
          OUTPUT_DIR: ${{ runner.temp }}/elsewhere-clean-phrases-v2
        run: |
          set -e
          dest=stories/series/elsewhere/reboot-2026/episodes/episode-001/audio/clean-phrases-v2
          mkdir -p "$dest"
          cp "$OUTPUT_DIR/elsewhere-ep1-clean-complete-phrases-v2.mp3" "$dest/"
          cp "$OUTPUT_DIR/opening-and-childhood-clean.mp3" "$dest/"
          cp "$OUTPUT_DIR/last-evening-and-news-clean.mp3" "$dest/"
          cp "$OUTPUT_DIR/crooked-lantern-clean.mp3" "$dest/"
          cp "$OUTPUT_DIR/clean-v2-edit-report.json" "$dest/"
          git config user.name "Elsewhere Audio Builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "$dest/elsewhere-ep1-clean-complete-phrases-v2.mp3" "$dest/opening-and-childhood-clean.mp3" "$dest/last-evening-and-news-clean.mp3" "$dest/crooked-lantern-clean.mp3" "$dest/clean-v2-edit-report.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save old-method untrimmed full-cast Episode 1 rebuild as QA-only preview"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin elsewhere-reboot-2026
            git rebase origin/elsewhere-reboot-2026
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elsewhere-episode1-clean-phrase-review
          path: |
            ${{ runner.temp }}/elsewhere-clean-phrases-v2/elsewhere-ep1-clean-complete-phrases-v2.mp3
            ${{ runner.temp }}/elsewhere-clean-phrases-v2/clean-v2-edit-report.json
          if-no-files-found: warn
          retention-days: 14
