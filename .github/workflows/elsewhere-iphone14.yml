name: Elsewhere Episode 1 - iPhone 14 illustrations
on:
  push:
    branches: [elsewhere-reboot-2026]
    paths:
      - '.github/workflows/elsewhere-iphone14.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-portrait-crops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Ohana main catalog
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Resize all seven published scenes to native iPhone 14 portrait
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageOps
          catalog_path=Path("stories/index.json")
          doc=json.loads(catalog_path.read_text(encoding="utf-8"))
          entry=next((e for e in doc["episodes"] if e["id"]=="elsewhere-001"),None)
          if entry is None:raise RuntimeError("Cannot find Elsewhere Episode 1")
          if len(entry.get("images",[]))!=7:raise RuntimeError("Expected seven episode illustrations; found "+str(len(entry.get("images",[]))))
          resized=[]
          root=Path("stories")
          for i,item in enumerate(entry["images"],1):
              original=root/item["path"]
              if not original.exists():raise RuntimeError("Missing original image: "+str(original))
              outfile=original.parent/"iphone14"/f"{i:02d}-episode-001-iphone14.jpg"
              outfile.parent.mkdir(parents=True,exist_ok=True)
              with Image.open(original) as source:
                  portrait=ImageOps.fit(source.convert("RGB"),(1170,2532),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
                  portrait.save(outfile,"JPEG",quality=93,optimize=True,subsampling=0)
              if Image.open(outfile).size!=(1170,2532):raise RuntimeError("Incorrect output ratio")
              resized.append({"path":outfile.relative_to(root).as_posix(),"caption":item["caption"]})
              print(f"{i}: {original} -> {outfile}")
          entry["images"]=resized
          catalog_path.write_text(json.dumps(doc,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          metadata_path=Path("stories/series/elsewhere/episodes/episode-001/metadata.json")
          metadata=json.loads(metadata_path.read_text(encoding="utf-8"))
          metadata["illustrations"]=[x["path"] for x in resized]
          metadata["illustration_canvas"]={"width":1170,"height":2532,"orientation":"portrait","fit":"cover","device":"iPhone 14"}
          metadata_path.write_text(json.dumps(metadata,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("Seven 1170x2532 illustrations and both catalog entries updated")
          PY
      - name: Publish new images and catalog paths on main
        shell: bash
        run: |
          git config user.name "Elsewhere Illustrations"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories/index.json stories/series/elsewhere/episodes/episode-001/metadata.json stories/series/elsewhere/episodes/episode-001/illustrations/iphone14
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish seven native iPhone 14 portrait images for Elsewhere Ep 1"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
